[package]
name = "backend"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = { version = "0", default-features = false, features = ["tokio", "http1"]}
base64 = "0"
futures-util = "0"
hex = "0"
hmac = "0"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2", "stream"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros"] }
tokio-stream = "0"
tower = "0"
tower-http = { version = "0", features = ["fs"] }
tower-cookies = { version = "0", features = ["private"]}
webpki-root-certs = "1"