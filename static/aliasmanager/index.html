<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Alias Manager</title>
	<script defer src="main.js"></script>
	<link rel="stylesheet" href="style.css">
	<style>
		

		input {
			display: block;
		}


	</style>
</head>
<body>
	<div id="alias_list"></div>
	<dialog>
		<h1>Settings</h1>
		<label for="bearer"><a href="https://manager.infomaniak.com/v3/ng/accounts/token/list">Bearer Token with access to the mail scope</a></label>
		<input type="text" id="bearer" name="bearer">
		<p>Enter the Infomaniak Manager and go to your desiered Mail Service - E-Mail Address. The link should look something like this:</p>
		<code>https://manager.infomaniak.com/v3/mail/CLIENT_NUMBER/mail-service/MAIL_HOSTING_ID/mailboxes/MAILBOX_NAME/dashboard/users</code>
		<label for="filter_mailbox">MAILBOX_NAME where the filter should be (normally catchall)</label>
		<input type="text" id="filter_mailbox" name="filter_mailbox">
		<label for="alias_mailbox">MAILBOX_NAME where the aliases should be registered</label>
		<input type="text" id="alias_mailbox" name="alias_mailbox">
		<label for="mail_hosting_id">MAIL_HOSTING_ID of the desiered domain</label>
		<input type="text" id="mail_hosting_id" name="mail_hosting_id">
		<br>
		<label for="mail_hosting_id">MAIL_HOSTING_ID of the desiered domain</label>
		<textarea id="filter_action"></textarea>
	</dialog>
</body>
</html>
